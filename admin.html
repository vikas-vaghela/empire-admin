<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel - Empire Steps</title>
<style>
body{background:#f4f6f9;color:#333;font-family:'Poppins',sans-serif;margin:0;padding:20px}
.form-container,.products-container{max-width:600px;margin:20px auto;padding:25px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);box-sizing:border-box}
h2,h3{text-align:center;color:#000;margin-top:0}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px;box-sizing:border-box;outline:none;font-family:'Poppins',sans-serif}
input:focus,select:focus,textarea:focus{border-color:#000}
.upload-label{display:block;width:100%;padding:12px;background:#0066ff;color:#fff;border-radius:8px;font-weight:600;text-align:center;cursor:pointer;margin-bottom:10px;box-sizing:border-box}
.size-container{display:flex;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff}
.size-container label{display:flex;align-items:center;gap:5px;width:auto;font-weight:500;margin:0}
.size-container input{width:auto;padding:0}
.save-btn{width:100%;padding:13px;background:#28a745;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.product-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;gap:10px}
.product-info{display:flex;align-items:center;gap:12px}
.product-info img{width:50px;height:50px;object-fit:cover;border-radius:6px}
.action-btns{display:flex;gap:8px}
.edit-btn{background:#ffc107;border:0;padding:6px 12px;border-radius:5px;font-weight:600}
.delete-btn{background:#dc3545;color:#fff;border:0;padding:6px 12px;border-radius:5px}
.size-title{font-size:13px;font-weight:600;color:#555;margin:14px 0 7px}
.banner-open{position:fixed;top:15px;right:18px;z-index:1000;background:#000;color:#fff;border:0;border-radius:50px;padding:11px 17px;font-weight:700;cursor:pointer}
.banner-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;padding:20px;overflow:auto}
.banner-box{max-width:600px;margin:30px auto;background:#fff;border-radius:15px;padding:25px;position:relative}
.banner-close{position:absolute;right:15px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:#eee;font-size:22px;cursor:pointer}
.banner-preview{width:100%;height:230px;object-fit:cover;border-radius:10px;border:1px solid #ddd;margin:10px 0 15px}
.banner-save{width:100%;padding:13px;border:0;border-radius:8px;background:#000;color:#fff;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.banner-delete{width:100%;padding:11px;border:1px solid #dc3545;border-radius:8px;background:#fff;color:#dc3545;font-weight:700;margin-top:8px;cursor:pointer}
</style>
</head>
<body>

<button class="banner-open" onclick="openBannerPanel()">🖼️ Banner</button>

<div class="banner-panel" id="banner-panel">
<div class="banner-box">
<button class="banner-close" onclick="closeBannerPanel()">×</button>
<h2>Banner Management</h2>

<img id="banner-preview" class="banner-preview" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

<label class="upload-label" for="banner-image">📁 Upload New Banner</label>
<input type="file" id="banner-image" accept="image/*" style="display:none">
<p id="banner-file-count" style="font-size:12px;color:#666"></p>

<input type="text" id="banner-title" placeholder="Banner Title">
<br><br>
<input type="text" id="banner-subtitle" placeholder="Banner Subtitle">
<br><br>
<input type="text" id="banner-button" placeholder="Button Text e.g. Shop Now">
<br><br>
<input type="text" id="banner-link" placeholder="Button Link e.g. collection.html">

<button class="banner-save" onclick="saveBanner()">Save Banner</button>
<button class="banner-delete" onclick="deleteBanner()">Delete Banner</button>
</div>
</div>

<div class="form-container">
<h2 id="form-title">Add New Product</h2>

<form id="product-form" onsubmit="saveProductToFirebase(event)">
<input type="hidden" id="edit-product-id">

<div class="form-group">
<input type="text" id="p-name" placeholder="Product Name" required>
</div>

<div class="form-group">
<input type="text" id="p-brand" placeholder="Brand (Optional)">
</div>

<div class="form-group">
<input type="number" id="p-price" placeholder="Price (₹)" required>
</div>

<div class="form-group">
<label class="upload-label" for="p-images">📁 Upload Multiple Product Photos</label>
<input type="file" id="p-images" multiple accept="image/*" style="display:none">
<p id="file-count" style="font-size:12px;color:#666"></p>
</div>

<div class="form-group">
<input type="text" id="p-discount" placeholder="Discount % - Optional">
</div>

<div class="form-group">
<input type="number" id="p-orig-price" placeholder="Original Price - Optional">
</div>

<div class="form-group">
<input type="text" id="p-colors" placeholder="Colors - Optional">
</div>

<div class="form-group">
<textarea id="p-description" rows="3" placeholder="Product Details / Description"></textarea>
</div>

<div class="form-group">
<input type="text" id="p-material" placeholder="Material - Optional">
</div>

<div class="form-group">

<button type="submit" class="save-btn" id="submit-btn-text">Save Product</button>
</form>
</div>

<div class="products-container">
<h3>Existing Products</h3>
<div id="products-list">
<p style="text-align:center;color:#777">Loading products...</p>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDocs,doc,deleteDoc,updateDoc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"APKA_API_KEY_YAHAN_DALO",
authDomain:"empire-steps-admin.firebaseapp.com",
projectId:"empire-steps-admin",
storageBucket:"empire-steps-admin.appspot.com",
messagingSenderId:"144163770097",
appId:"APKA_APP_ID_YAHAN_DALO"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const CLOUD_NAME="da7hgw0js";
const UPLOAD_PRESET="empire_present";
const DEFAULT_IMAGE="https://images.unsplash.com/photo-1542291026-7eec264c27ff";
const bannerDoc=doc(db,"websiteSettings","mainBanner");

document.getElementById("p-images").addEventListener("change",function(){
document.getElementById("file-count").innerText=this.files.length?`${this.files.length} photos selected.`:"";
});

document.getElementById("banner-image").addEventListener("change",function(){
if(this.files.length){
document.getElementById("banner-file-count").innerText=this.files[0].name;
document.getElementById("banner-preview").src=URL.createObjectURL(this.files[0]);
}
});

async function uploadToCloudinary(file){
const fd=new FormData();
fd.append("file",file);
fd.append("upload_preset",UPLOAD_PRESET);

try{
const url=`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
const r=await fetch(url,{
method:"POST",
body:fd
});

if(!r.ok){
const errorText=await r.text();
console.error("Cloudinary Error:",errorText);
throw new Error("Cloudinary upload failed");
}

const d=await r.json();

if(!d.secure_url){
throw new Error("Cloudinary URL not received");
}

return d.secure_url;

}catch(e){
console.error("Upload Error:",e);
throw e;
}
}

window.openBannerPanel=function(){
document.getElementById("banner-panel").style.display="block";
loadBanner();
};

window.closeBannerPanel=function(){
document.getElementById("banner-panel").style.display="none";
};

async function loadBanner(){
try{
const s=await getDoc(bannerDoc);

if(s.exists()){
const b=s.data();

document.getElementById("banner-preview").src=b.image||DEFAULT_IMAGE;
document.getElementById("banner-title").value=b.title||"";
document.getElementById("banner-subtitle").value=b.subtitle||"";
document.getElementById("banner-button").value=b.buttonText||"Shop Now";
document.getElementById("banner-link").value=b.buttonLink||"collection.html";
}
}catch(e){
console.error(e);
}
}

window.saveBanner=async function(){
const btn=document.querySelector(".banner-save");
btn.innerText="Uploading...";

try{
const old=await getDoc(bannerDoc);

let image=old.exists()?old.data().image||"":"";

const file=document.getElementById("banner-image").files[0];

if(file){
image=await uploadToCloudinary(file);
}

if(!image){
alert("Pehle banner image upload karo.");
btn.innerText="Save Banner";
return;
}

btn.innerText="Saving...";

await setDoc(bannerDoc,{
image:image,
title:document.getElementById("banner-title").value.trim(),
subtitle:document.getElementById("banner-subtitle").value.trim(),
buttonText:document.getElementById("banner-button").value.trim()||"Shop Now",
buttonLink:document.getElementById("banner-link").value.trim()||"collection.html",
updatedAt:new Date()
});

alert("Banner update ho gaya!");

document.getElementById("banner-image").value="";
document.getElementById("banner-file-count").innerText="";
btn.innerText="Save Banner";

}catch(e){
console.error("Banner Save Error:",e);
alert("Banner upload/save nahi hua. Console me error check karo.");
btn.innerText="Save Banner";
}
};

window.deleteBanner=async function(){
if(!confirm("Current banner delete kare?"))return;

try{
await deleteDoc(bannerDoc);

document.getElementById("banner-preview").src=DEFAULT_IMAGE;
document.getElementById("banner-title").value="";
document.getElementById("banner-subtitle").value="";
document.getElementById("banner-button").value="";
document.getElementById("banner-link").value="";

alert("Banner delete ho gaya!");

}catch(e){
console.error(e);
alert("Banner delete nahi hua.");
}
};

window.loadExistingProducts=async function(){
const list=document.getElementById("products-list");
list.innerHTML="<p style='text-align:center;color:#777'>Loading products...</p>";

try{
const qs=await getDocs(collection(db,"products"));

list.innerHTML="";

if(qs.empty){
list.innerHTML="<p style='text-align:center;color:#777'>No products found.</p>";
return;
}

qs.forEach(s=>{
const p=s.data(),id=s.id;

const div=document.createElement("div");
div.className="product-item";

div.innerHTML=`
<div class="product-info">
<img src="${p.image||DEFAULT_IMAGE}" alt="Product">
<div>
<strong>${p.name||"Product"}</strong><br>
<small>₹${p.price||0} | ${p.brand||"No Brand"} | ${p.category||""}</small>
</div>
</div>

<div class="action-btns">
<button class="edit-btn" onclick="editProduct('${id}')">Update</button>
<button class="delete-btn" onclick="deleteProduct('${id}')">Delete</button>
</div>`;

list.appendChild(div);
});

}catch(e){
console.error(e);
}
};

window.saveProductToFirebase=async function(event){
event.preventDefault();

const btn=document.getElementById("submit-btn-text");
const editId=document.getElementById("edit-product-id").value;

btn.innerText="Uploading...";

const name=document.getElementById("p-name").value.trim();
const brand=document.getElementById("p-brand").value.trim();
const price=Number(document.getElementById("p-price").value);
const discount=document.getElementById("p-discount").value||"";
const originalPrice=document.getElementById("p-orig-price").value?Number(document.getElementById("p-orig-price").value):"";
const colors=document.getElementById("p-colors").value||"";
const description=document.getElementById("p-description").value||"";
const material=document.getElementById("p-material").value||"";
const category=document.getElementById("p-category").value;

const sizes=[...document.querySelectorAll('input[name="size"]:checked')].map(x=>x.value);

if(!sizes.length)sizes.push("Standard");

const files=document.getElementById("p-images").files;
const images=[];

try{

for(let i=0;i<files.length;i++){
images.push(await uploadToCloudinary(files[i]));
}

if(editId){

const data={
name,
brand,
price,
discount,
originalPrice,
colors,
description,
material,
category,
sizes
};

if(images.length){
data.image=images[0];
data.allImages=images;
}

await updateDoc(doc(db,"products",editId),data);

alert("Product update ho gaya!");

}else{

const image=images[0]||DEFAULT_IMAGE;

await addDoc(collection(db,"products"),{
name,
brand,
price,
discount,
originalPrice,
colors,
description,
material,
category,
sizes,
image,
allImages:images.length?images:[image],
createdAt:new Date()
});

alert("Product save ho gaya!");
}

document.getElementById("product-form").reset();
document.getElementById("file-count").innerText="";
document.getElementById("edit-product-id").value="";
document.getElementById("form-title").innerText="Add New Product";
btn.innerText="Save Product";

document.querySelectorAll('input[name="size"]').forEach(x=>x.checked=false);

loadExistingProducts();

}catch(e){
console.error("Product Error:",e);
alert("Image upload ya product save nahi hua.");
btn.innerText="Save Product";
}
};

window.deleteProduct=async function(id){
if(!confirm("Product delete kare?"))return;

try{
await deleteDoc(doc(db,"products",id));
alert("Product delete ho gaya!");
loadExistingProducts();
}catch(e){
console.error(e);
alert("Product delete nahi hua.");
}
};

window.editProduct=async function(id){
try{

const snap=await getDoc(doc(db,"products",id));

if(!snap.exists())return;

const p=snap.data();

document.getElementById("edit-product-id").value=id;
document.getElementById("p-name").value=p.name||"";
document.getElementById("p-brand").value=p.brand||"";
document.getElementById("p-price").value=p.price||"";
document.getElementById("p-discount").value=p.discount||"";
document.getElementById("p-orig-price").value=p.originalPrice||"";
document.getElementById("p-colors").value=p.colors||"";
document.getElementById("p-description").value=p.description||"";
document.getElementById("p-material").value=p.material||"";
document.getElementById("p-category").value=p.category||"man";

const boxes=document.querySelectorAll('input[name="size"]');

boxes.forEach(x=>x.checked=false);

(p.sizes||[]).forEach(sz=>{
boxes.forEach(x=>{
if(x.value===sz)x.checked=true;
});
});

document.getElementById("form-title").innerText="Update Product";
document.getElementById("submit-btn-text").innerText="Update Product";

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(e){
console.error(e);
}
};

loadExistingProducts();
</script>
</body>
</html>
